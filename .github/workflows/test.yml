name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '53 2 * * *'
  workflow_dispatch:
concurrency:
  group: commute-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check the engine
        run: npm run typecheck
      - name: index.html is built from src/
        run: npm run build && git diff --exit-code -I 'id="build"' index.html
      - name: Context kept current (docs/, CLAUDE.md)
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # Compare with the PR's base, else the previous push, else main (a new branch).
          base="$PR_BASE"
          if [ -z "$base" ]; then base="$PUSH_BEFORE"; fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base=origin/main; fi
          if [ "$(git rev-parse "$base")" = "$(git rev-parse HEAD)" ]; then node tools/check-docs.mjs; exit; fi
          node tools/check-docs.mjs --since "$base"
      - name: All tests
        run: node tools/run-tests.mjs
  ios:
    needs: test
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Bundle the committed website
        run: npm run ios:sync
      - name: Cold launch without network on iPhone
        run: npm run ios:test
      - name: Dependency locks remain unchanged
        run: git diff --exit-code -- package-lock.json ios/App/CapApp-SPM/Package.swift ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - name: Simulator results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-test-results
          path: ios/DerivedData/Logs/Test/*.xcresult
          retention-days: 7
  # A merge by Merge when green (GITHUB_TOKEN) dispatches this workflow on main, and such a run creates no workflow_run
  # event for TestFlight. So once both jobs pass on a dispatched main run, start TestFlight for that exact commit.
  testflight:
    needs: [test, ios]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start TestFlight for this tested main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run testflight.yml --repo "${{ github.repository }}" --ref main -f source_sha="${{ github.sha }}" -f tests_run_id="${{ github.run_id }}"
  # how-we-work RULES 3-4: the live site publishes only a main commit whose web and iPhone jobs passed in this run
  # (docs/stories/only-tested-code-goes-live.md). It needs Settings → Pages → Source set to "GitHub Actions" (Sam).
  # Until then the source is still "Deploy from a branch": this finds that and publishes nothing, and the old branch
  # build carries on (Merge when green asks for it after a pipeline merge). Covers Sam's own merges (push) and the
  # Tests run Merge when green dispatches; not the nightly run or pull requests.
  pages-source:
    needs: [test, ios]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - name: Publish only from GitHub Actions, and only the newest main
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          source=$(gh api "repos/$REPO/pages" --jq .build_type)
          newest=$(gh api "repos/$REPO/commits/main" --jq .sha)
          if [ "$source" != workflow ]; then
            echo "::notice::Pages source is '$source', not GitHub Actions: nothing published from here (the branch build still publishes)."
            echo publish=no >> "$GITHUB_OUTPUT"
          elif [ "$newest" != "$SHA" ]; then
            echo "::notice::main has moved on to $newest; that commit's Tests run publishes it, not this older one."
            echo publish=no >> "$GITHUB_OUTPUT"
          else
            echo publish=yes >> "$GITHUB_OUTPUT"
          fi
  pages:
    needs: pages-source
    if: needs.pages-source.outputs.publish == 'yes'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The committed site as it is (the test job has checked index.html is built from src/); no build step.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish the tested commit
        id: deploy
        uses: actions/deploy-pages@v4
