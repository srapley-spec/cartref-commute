name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check the engine
        run: npm run typecheck
      - name: index.html is built from src/
        run: npm run build && git diff --exit-code -I 'id="build"' index.html
      - run: npm test
